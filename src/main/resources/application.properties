spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:exchangedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.threads.virtual.enabled=true

app.security.jwt.secret=${JWT_SECRET:dev-only-secret-key-with-sufficient-length-1234567890}
app.security.rate-limit.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
app.security.rate-limit.login.window-seconds=${AUTH_LOGIN_WINDOW_SECONDS:900}
app.security.rate-limit.register.max-attempts=${AUTH_REGISTER_MAX_ATTEMPTS:10}
app.security.rate-limit.register.window-seconds=${AUTH_REGISTER_WINDOW_SECONDS:900}
app.security.rate-limit.password-reset.max-attempts=${AUTH_PASSWORD_RESET_MAX_ATTEMPTS:5}
app.security.rate-limit.password-reset.window-seconds=${AUTH_PASSWORD_RESET_WINDOW_SECONDS:900}
app.admin.bootstrap.username=${ADMIN_USERNAME:admin}
app.admin.bootstrap.password=${ADMIN_PASSWORD:admin123}
app.security.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}

app.market-data.base-url=${MARKET_DATA_BASE_URL:http://market-data-service}
app.market-data.quote-path=${MARKET_DATA_QUOTE_PATH:/api/v1/quotes/{symbol}}
app.market-data.symbols=${MARKET_DATA_SYMBOLS:BTC/USDT}
app.arbitrage.symbol=${ARBITRAGE_SYMBOL:BTC/USDT}
