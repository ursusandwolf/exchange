spring.profiles.default=dev

spring.h2.console.enabled=false
spring.datasource.url=jdbc:h2:mem:exchangedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

spring.threads.virtual.enabled=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.security.jwt.cookie-max-age-seconds=${JWT_COOKIE_MAX_AGE_SECONDS:86400}
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.security.ws.allowed-origin-patterns=${WS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
app.security.rate-limit.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
app.security.rate-limit.login.window-seconds=${AUTH_LOGIN_WINDOW_SECONDS:900}
app.security.rate-limit.register.max-attempts=${AUTH_REGISTER_MAX_ATTEMPTS:10}
app.security.rate-limit.register.window-seconds=${AUTH_REGISTER_WINDOW_SECONDS:900}
app.security.rate-limit.password-reset.max-attempts=${AUTH_PASSWORD_RESET_MAX_ATTEMPTS:5}
app.security.rate-limit.password-reset.window-seconds=${AUTH_PASSWORD_RESET_WINDOW_SECONDS:900}
app.admin.bootstrap.username=${ADMIN_USERNAME}
app.admin.bootstrap.password=${ADMIN_PASSWORD}
app.security.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}

app.market-data.base-url=${MARKET_DATA_BASE_URL:http://market-data-service}
app.market-data.quote-path=${MARKET_DATA_QUOTE_PATH:/api/v1/quotes/{symbol}}
app.market-data.symbols=${MARKET_DATA_SYMBOLS:BTC/USDT}
app.market-data.oracle.enabled=${MARKET_DATA_ORACLE_ENABLED:true}
app.market-data.connect-timeout-ms=${MARKET_DATA_CONNECT_TIMEOUT_MS:2000}
app.market-data.read-timeout-ms=${MARKET_DATA_READ_TIMEOUT_MS:3000}
app.arbitrage.symbol=${ARBITRAGE_SYMBOL:BTC/USDT}
app.arbitrage.enabled=${ARBITRAGE_ENABLED:true}
app.arbitrage.bot-password=${ARBITRAGE_BOT_PASSWORD:}
