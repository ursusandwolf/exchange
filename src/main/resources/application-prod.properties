# Production: set JWT_SECRET and ADMIN_PASSWORD via environment (no insecure defaults).
spring.h2.console.enabled=false
app.arbitrage.enabled=${ARBITRAGE_ENABLED:false}
server.forward-headers-strategy=framework

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.cookie-secure=true
app.security.trust-forwarded-headers=true
app.admin.bootstrap.username=${ADMIN_USERNAME}
app.admin.bootstrap.password=${ADMIN_PASSWORD}
